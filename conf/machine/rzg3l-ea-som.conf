#@TYPE: Machine
#@NAME: Embedded Artists RZ/G3L SOM Board
#@DESCRIPTION: Machine configuration for Embedded Artists RZ/G3L SOM Board

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/rz-common.inc
require conf/machine/include/rzg3l-family.inc

# Machine configuration
MACHINE_FEATURES:append = " alsa ext2 pci serial usbgadget usbhost can"

# Changing default tune in order not to not use -mcpu as compile flag
# Without this change, -mcpu=cortex-a55 will be used and this will
# conflict with onnxruntime which use -march=armv8.2-a+i8mm for
# for example QgemmS8S8KernelSmmla.S
DEFAULTTUNE = "armv8-2a-crypto"

# Trusted Firmware-A configuration
PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_PLATFORM ?= "g3l"
TFA_BOARD ?= "smarc"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 fip"
BL2_BOOT_TARGET ?= "spi mmc esd"
BL2_BASE_ADDR ?= "0x23000"
BL2_ADJUST_VMA ?= "0x21E00"
FIP_ADJUST_VMA ?= "0x0000"
EXTRA_IMAGEDEPENDS += " firmware-pack"

# U-Boot Configuration
UBOOT_CONFIG ??= "rzg3l-ea-som"
UBOOT_CONFIG[rzg3l-ea-som] = "rzg3l-ea-som_defconfig"
PREFERRED_PROVIDER_u-boot = "u-boot-ea"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-ea"
PREFERRED_VERSION_u-boot = "2024.07%"

IMAGE_BOOT_FILES = " \
	bl2_bp_spi-${MACHINE}.bin \
	bl2_bp_spi-${MACHINE}.srec \
	bl2_bp_mmc-${MACHINE}.bin \
	bl2_bp_mmc-${MACHINE}.srec \
	fip-${MACHINE}.bin \
	fip-${MACHINE}.srec \
	Flash_Writer_SCIF_RZG3L_USER_LPDDR4.mot \
"

# Linux Configuration
PREFERRED_PROVIDER_virtual/kernel = "linux-ea"
PREFERRED_VERSION_linux-ea = "6.12%"
KERNEL_DEVICETREE = "\
	renesas/rzg3l-ea-som-kit.dtb \
"

# Wic image
WKS_FILE = "rz-image-bootpart-esd.wks"
do_image_wic[depends] += "firmware-pack:do_deploy flash-writer:do_deploy"
